<title>Seite nicht verfügbar</title>
<style>

.box{max-width:420px;border-top:1px solid #0A0A08;padding-top:1.5rem}
h1{font-weight:900;font-size:1.6rem;letter-spacing:-0.02em;line-height:1.15;margin-bottom:0.75rem}
p{color:#555;line-height:1.6}
</style>
</head>
<body><div class="box">
  <h1>Diese Seite ist nicht verfügbar.</h1>

</div></body>
</html>
