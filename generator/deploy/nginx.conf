# /etc/nginx/sites-available/stellenschraube
# Landingpage (index.html aus dem Repo) statisch, Generator und Kundenseiten über Gunicorn.
server {
    server_name stellenschraube.ch www.stellenschraube.ch;
    root /opt/stellenschraube;

    location = / { try_files /index.html =404; }
    location = /robots.txt { }

    # Vorschau-Maske, API, Kundenseiten, interne Übersicht
    location ~ ^/(vorschau|api|employer|intern|health) {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    # SSL danach mit: sudo certbot --nginx -d stellenschraube.ch -d www.stellenschraube.ch
}
